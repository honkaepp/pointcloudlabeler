[package]
name = "pointcloudlabeler-editor"
version = "0.1.3"
description = "Tree segmentation, editing and label transfer for close-range forest point clouds"
authors = ["Eppu Honkanen"]
license = "GPL-3.0-or-later"
repository = "https://github.com/honkaepp/pointcloudlabeler"
edition = "2021"
rust-version = "1.77"

# The headless binary is the `headless/` crate beside this one, not a
# second `[[bin]]` here: the installer bundles every binary of this
# package, and one built with other features is not there to bundle.
[workspace]
members = ["headless"]

# The desktop application. `required-features` keeps it out of a
# `--no-default-features` build, which is how the headless surfaces
# (command line, console, API) are built on a machine with no display
# and no WebKit — see the `gui` feature below.
[[bin]]
name = "pointcloudlabeler-editor"
path = "src/main.rs"
required-features = ["gui"]

# The headless binary — the command line and, with their features, the
# console interface, the HTTP API and the MCP server, see src/headless —
# is the `headless/` crate: `cargo build --release -p pointcloudlabeler`,
# on a machine with no display and no WebKit.

[lib]
name = "pointcloudlabeler_editor_lib"
# rlib is enough for desktop; staticlib/cdylib are only needed for mobile targets.
# Keeping a single crate type avoids the output-filename collision that confuses
# the integration test build.
crate-type = ["rlib"]

[features]
#
# `gui` is the desktop runtime: Tauri, its dialog and filesystem plugins,
# and the WebView2 crash watch on Windows. It is on by default because
# the desktop application is what `npm run tauri build` makes. Turned
# off, the same library builds with no Tauri crate at all — no GTK, no
# WebKit on Linux — for the headless binary: the command-line interface,
# the console interface, the HTTP API and the MCP server. Every
# analysis pass is written against `crate::progress::Progress` rather
# than a window, so the two builds run the same code; only the 146
# `#[tauri::command]` wrappers and the menu, dialog and crash-watch
# modules are gated. Nothing in `gui` is proprietary: Tauri and its
# plugins are MIT / Apache-2.0, recorded in THIRD-PARTY-NOTICES.md like
# every other crate.
default = ["gui"]
gui = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-fs",
    "dep:tauri-build",
    "dep:webview2-com",
    "dep:windows-core",
]
#
# The headless surfaces (src/headless), none of them in the desktop
# build. `cli` is the command line and the batch recipes; `headless`
# is every surface at once. Nothing in them is proprietary; their
# crates are recorded in THIRD-PARTY-NOTICES.md like every other.
cli = ["dep:clap"]
# The console interface (`pointcloudlabeler tui`): ratatui over crossterm.
tui = ["cli", "dep:ratatui", "dep:crossterm"]
# The Model Context Protocol server over stdio (`pointcloudlabeler
# mcp`). JSON-RPC written against the protocol; no crate.
mcp = ["cli"]
# The HTTP API (`pointcloudlabeler serve`): the catalogue as JSON
# endpoints with jobs and progress streams, and the MCP streamable HTTP
# transport. hyper as a SERVER only — see the comment at the
# dependency, and src/persistence/noNetwork.test.ts for the rule it
# must keep. `api-tls` adds HTTPS with a certificate and key the user
# supplies.
api = ["cli", "mcp", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio", "dep:bytes"]
api-tls = ["api", "dep:tokio-rustls", "dep:rustls", "dep:rustls-pki-types"]
headless = ["cli", "tui", "mcp", "api", "api-tls"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
# Reads the bundle identifier out of tauri.conf.json at build time — see
# build.rs's emit_app_identifier. Already in the dependency graph, so this
# adds nothing to fetch.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a double read back from a JSON file — a registration's
# standard error, a pose — is the double that was written, to the bit,
# instead of the fast parse's nearly-so.
serde_json = { version = "1", features = ["float_roundtrip"] }
# JSON Schema for the operation catalogue (src/ops): every headless
# surface — the command line's help, the API's operation listing, the
# MCP server's tools/list — describes an operation's parameters from the
# same derive the parameters are parsed with. Already in the dependency
# tree through Tauri; naming it here adds no new crate.
schemars = "1"
# The command line (feature `cli`). Builder API only — the subcommands
# are generated from the operation catalogue at start-up, so there is
# nothing to derive. Held at 4.5 for the crate's Rust 1.77 floor: 4.6
# needs 1.85.
clap = { version = "~4.5", features = ["string", "env"], optional = true }
# The console interface (feature `tui`). Both held back for the Rust
# 1.77 floor: ratatui 0.30 needs 1.86, crossterm 0.29 is fine but
# ratatui 0.29 asks for 0.28.
ratatui = { version = "~0.29", optional = true }
crossterm = { version = "~0.28", optional = true }
# The HTTP API (feature `api`). hyper with its SERVER features only:
# this process listens; it never connects anywhere, and the rule that
# the application has no network egress (noNetwork.test.ts) holds —
# that test checks these features and that `api` is in no default
# build. All five crates are already in the dependency tree through
# Tauri; naming them adds nothing to fetch.
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"], optional = true }
bytes = { version = "1", optional = true }
# HTTPS for the API (feature `api-tls`): rustls with the ring provider,
# so the build needs no cmake or assembler beyond what ring carries.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
thiserror = "1"
once_cell = "1"
dirs = "5"
# Out-of-core LAZ/LAS streaming reader for the octree converter. `laz`
# feature pulls in the LASzip decoder so .laz files decode chunk-by-chunk
# on disk without ever needing the whole compressed file in memory.
# `laz-parallel` additionally exposes laz-rs's ParLasZipDecompressor for
# true multi-core decompression (the chunk table dispatches LASzip
# chunks across threads), which the octree converter uses directly.
las = { version = "0.9", features = ["laz-parallel"] }
# Direct laz-rs dep so the converter can reach ParLasZipDecompressor /
# LazVlr without going through the higher-level `las::Reader` (which
# is sequential). Cargo deduplicates to the same laz version as
# las/laz-parallel pulls.
laz = { version = "0.12", features = ["parallel"] }
# Fast non-cryptographic hasher for the per-node spacing accelerator —
# the default SipHash is ~5-10× slower than rustc-hash on the per-point
# inserts that dominate octree build time.
rustc-hash = "2"
# Data-parallel iterators for the per-chunk octree build phase. The
# converter bins points to disk first (one thread, I/O-bound) and then
# builds each chunk's sub-octree in parallel across CPU cores via
# par_iter.
rayon = "1"
# Lightweight pull-style XML parser for a scanner project's root XML
# (pose matrices and the scan-position list). No serde derive — the
# parser walks a small known schema directly.
#
# 0.42 for RUSTSEC-2026-0194 / -0195 (a quadratic duplicate-attribute
# check and unbounded namespace allocation; both fixed from 0.41). This
# was held at 0.36 because 0.37 began emitting an entity reference as
# its own event, so a text node with one arrived split across several
# and the parser's last-text-wins rule truncated the name. The parser
# now gathers an element's text across those events and reads it once
# when the element closes — `an_entity_in_a_name_is_unescaped` pins
# "Plot 3 &amp; 4 &lt;north&gt;" coming back whole.
# E57 reader (ASTM E2807). Pure Rust, no FFI — every major TLS / MLS
# vendor (FARO, Leica, Trimble, NavVis, Emesent, XGRIDS, GreenValley)
# exports E57 from their processing software, so one importer covers a
# wide swath of the Preprocessing module without per-vendor SDKs. Used
# by the e57_* commands; never touches the existing octree path.
e57 = "0.11"
proj4rs = "0.1.10"
mimalloc = "0.1"

# Windows memory gauges for sysmem.rs — GlobalMemoryStatusEx (what the
# machine has free) and GetProcessMemoryInfo (this process's working
# set). windows-sys is already in the dependency tree several times over
# through tauri; this adds three features to it and no new crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
# WebView2's ProcessFailed event, for crash.rs: the renderer process
# dying under the page is reported to the host and nowhere else. Both
# crates are already in the tree through tauri-runtime-wry, at these
# versions; naming them here adds no new crate.
webview2-com = { version = "0.38", optional = true }
windows-core = { version = "0.61", optional = true }

[profile.release]
# panic: UNWIND, deliberately, and not the smaller "abort".
#
# Every Tauri command here runs its work through spawn_blocking and ends
# with `.map_err(|e| format!("join error: {e}"))` — code written on the
# assumption that a panic comes back as a failed join and reaches the
# user as an error message. That only holds if the panic unwinds. Under
# "abort" the same panic ended the process instead: the window vanished
# mid-run, with no message and with whatever was unsaved. The two
# reachable panics found so far (a clamp whose bounds crossed at a
# plausible panel setting, a division by a pointBytes read from a damaged
# metadata.json) are fixed, but the profile should not be the thing
# deciding how the next one behaves.
#
# The codebase is already unwind-correct: there is no `.lock().unwrap()`
# anywhere in it, `lock_dataset` maps a poisoned mutex to an error, and
# `DatasetGuard::drop` — which runs during unwinding and releases the
# dataset — handles poisoning too.
codegen-units = 1
lto = true
# opt-level: 3, not "s". PointCloudLabeler's work is rayon loops over millions of
# points — segmentation, the DTM build, the morphological filter, RANSAC
# — where instruction count is what the user waits on.
#
# Measured on this tree, stripped Linux binary: 12.5 MB at `panic =
# "abort"` + opt-level "s", 18.8 MB with unwind + opt-level 3. The
# +6.3 MB buys back the error path the commands are written around and
# the optimiser's full inlining; beside the WebView and Tauri runtime an
# installer carries anyway it is not the number that decides anything.
# Revisit with a real plot if download size ever becomes the constraint.
opt-level = 3
strip = true
# overflow-checks stays at the release default (off), deliberately. The
# measurements are carried in f64 and the index arithmetic is bounded, so
# a check would cost in every hot loop to convert a wrap into a panic —
# and a panic is the outcome this profile is trying to make rarer.
